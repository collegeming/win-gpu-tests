name: build-d3d11-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test_d3d11.cpp'
      - 'test_vk_features.cpp'
      - 'test_vk_compute.cpp'
      - 'text_glyph_probe.cpp'
      - 'compute.comp'
      - 'compute_nop.comp'
      - 'third_party/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  spirv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Compile compute.comp to SPIR-V
        run: |
          set -euo pipefail
          glslangValidator --version
          glslangValidator -V --target-env vulkan1.0 compute.comp -o compute.spv
          glslangValidator -V --target-env vulkan1.0 compute_nop.comp -o compute_nop.spv
          xxd -i -n compute_spirv compute.spv > compute_spirv.h
          xxd -i -n compute_nop_spirv compute_nop.spv > compute_nop_spirv.h
          ls -l compute.spv compute_nop.spv compute_spirv.h compute_nop_spirv.h
          head -2 compute_spirv.h
          tail -1 compute_spirv.h
          tail -1 compute_nop_spirv.h
      - uses: actions/upload-artifact@v4
        with:
          name: compute-spirv
          path: |
            compute_spirv.h
            compute_nop_spirv.h
          if-no-files-found: error
  build:
    needs: spirv
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compute-spirv
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build D3D11 smoke test
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /std:c++17 test_d3d11.cpp /Fe:test_d3d11_arm64.exe d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\test_d3d11_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\test_d3d11_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - name: Build Vulkan feature probe
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /std:c++17 /I third_party\vulkan\include test_vk_features.cpp /Fe:vk_features_arm64.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\vk_features_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS-vk.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\vk_features_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - name: Build Vulkan compute test
        shell: cmd
        run: |
          powershell -NoProfile -Command "'spirv header: ' + (Get-FileHash .\compute_spirv.h -Algorithm SHA256).Hash"
          cl /nologo /EHsc /O2 /std:c++17 /I third_party\vulkan\include test_vk_compute.cpp /Fe:vk_compute_arm64.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\vk_compute_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS-compute.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\vk_compute_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - uses: actions/upload-artifact@v4
        with:
          name: test-d3d11-arm64
          path: |
            test_d3d11_arm64.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-vk-features-arm64
          path: |
            vk_features_arm64.exe
            SHA256SUMS-vk.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-vk-compute-arm64
          path: |
            vk_compute_arm64.exe
            SHA256SUMS-compute.txt
          if-no-files-found: error
      - name: Build offscreen text glyph probe (D3D11+D2D/DirectWrite, GDI)
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /W4 /std:c++17 /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 text_glyph_probe.cpp /Fe:text_glyph_probe_arm64.exe d3d11.lib dxgi.lib d2d1.lib dwrite.lib d3dcompiler.lib gdi32.lib user32.lib ole32.lib version.lib
          if errorlevel 1 exit /b 1
      - name: Self-test, runner evidence snapshot and package text glyph probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\text_glyph_probe_arm64.exe).Path
          $b = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xaa64) { throw 'Expected ARM64 PE' }
          $dir = Join-Path $env:RUNNER_TEMP ('text-glyph-' + [guid]::NewGuid())
          New-Item -ItemType Directory $dir | Out-Null
          & $exe --self-test --log "$dir\self-test.txt"
          $selfTestExit = $LASTEXITCODE
          if (-not (Test-Path "$dir\self-test.txt")) { throw 'self-test wrote no log' }
          Get-Content "$dir\self-test.txt"
          if ($selfTestExit -ne 0) { throw "CPU self-test exit=$selfTestExit" }
          if (-not (Select-String -Path "$dir\self-test.txt" -SimpleMatch 'SELF_TEST=PASS' -Quiet)) { throw 'Missing SELF_TEST=PASS' }
          # Runner evidence only. The hosted runner has no target GPU, so these
          # exits are recorded, never gated; device acceptance is separate.
          & $exe --mode full --mode d2d-primitives --mode dwrite-offscreen --mode bitmap-brush --mode a8-contract --mode drawline --mode a8-upload --mode rt-to-srv --mode d2d-aa-modes --mode text-paths --mode clip-contract --mode mask-uint --mode dualsrc-blend --log "$dir\runner-hardware.txt" | Out-Null
          $hwExit = $LASTEXITCODE
          & $exe --driver warp --mode full --mode d2d-primitives --mode dwrite-offscreen --mode bitmap-brush --mode a8-contract --mode drawline --mode a8-upload --mode rt-to-srv --mode d2d-aa-modes --mode text-paths --mode clip-contract --mode mask-uint --mode dualsrc-blend --log "$dir\runner-warp.txt" | Out-Null
          $warpExit = $LASTEXITCODE
          # Surface the evidence verdicts in the job log so a non-zero evidence
          # exit is diagnosable without the artifact; the full logs are packaged.
          Write-Host "evidence_exits hardware=$hwExit warp=$warpExit"
          foreach ($f in @('runner-hardware.txt', 'runner-warp.txt')) {
            Write-Host "--- $f failures and summaries ---"
            Select-String -Path "$dir\$f" -Pattern 'RESULT=FAIL', 'RESULT=SKIP', 'SUMMARY' |
              ForEach-Object { $_.Line }
          }
          New-Item -ItemType Directory text-glyph-package | Out-Null
          Copy-Item $exe, text_glyph_probe.cpp text-glyph-package
          Copy-Item .github\workflows\build.yml text-glyph-package\build-workflow.yml
          Copy-Item "$dir\self-test.txt", "$dir\runner-hardware.txt", "$dir\runner-warp.txt" text-glyph-package
          @"
          source_commit=$env:GITHUB_SHA
          source_branch=$env:GITHUB_REF_NAME
          run=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          build_utc=$([DateTime]::UtcNow.ToString('o'))
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          machine=0x$($machine.ToString('x4')) subsystem=console
          compiler=MSVC cl /EHsc /O2 /W4 /std:c++17
          self_test=PASS (CPU analyzer + PASS/FAIL gate, 6 synthetic cases, no device/font)
          runner_hardware_exit=$hwExit (hosted runner evidence, not gated)
          runner_warp_exit=$warpExit (hosted runner evidence, not gated)
          hardware_device=NOT_TESTED
          modes=full,d2d-primitives,dwrite-offscreen,bitmap-brush,a8-contract,drawline,a8-upload,rt-to-srv,d2d-aa-modes,text-paths,clip-contract,mask-uint,dualsrc-blend (additive; full == no --mode)
          v2_result=NOT_TESTED (mode items judge expected ink/colour per region; device run decides)
          v3_result=NOT_TESTED (a8-contract judges A8_UNORM values; drawline separates AA paths)
          v4_result=NOT_TESTED (a8-upload judges UpdateSubresource upload and SRV->PS value; rt-to-srv judges RT->SRV; d2d-aa-modes and text-paths judge per-item ink; device run decides)
          v5_result=NOT_TESTED (clip-contract judges clip/discard keep-vs-drop; mask-uint judges R32_UINT write/Load/countbits/array index; dualsrc-blend judges SRC1 blend factors; device run decides)
          "@ | Set-Content text-glyph-package\build-info.txt -Encoding utf8
          @'
          text_glyph_probe_arm64.exe
          text_glyph_probe_arm64.exe --driver warp
          text_glyph_probe_arm64.exe --self-test
          text_glyph_probe_arm64.exe --mode d2d-primitives
          text_glyph_probe_arm64.exe --mode dwrite-offscreen
          text_glyph_probe_arm64.exe --mode bitmap-brush
          text_glyph_probe_arm64.exe --mode a8-contract
          text_glyph_probe_arm64.exe --mode drawline
          text_glyph_probe_arm64.exe --mode a8-upload
          text_glyph_probe_arm64.exe --mode rt-to-srv
          text_glyph_probe_arm64.exe --mode d2d-aa-modes
          text_glyph_probe_arm64.exe --mode text-paths
          text_glyph_probe_arm64.exe --mode clip-contract
          text_glyph_probe_arm64.exe --mode mask-uint
          text_glyph_probe_arm64.exe --mode dualsrc-blend
          text_glyph_probe_arm64.exe --mode full --mode d2d-primitives --mode dwrite-offscreen --mode bitmap-brush --mode a8-contract --mode drawline --mode a8-upload --mode rt-to-srv --mode d2d-aa-modes --mode text-paths --mode clip-contract --mode mask-uint --mode dualsrc-blend --log C:\path\probe.txt

          Console ARM64. Creates no window, requests no focus/activation, reads no screen.
          Paths run in order d3d11_d2d then gdi; each prints its stages with HRESULT and
          Win32 codes and one RESULT line. Exit 0 only if both PASS; exit 2 on any failure.
          Offscreen surface is 512x128 BGRA8; text "TEST 123"; font "Segoe UI" 48 px;
          analysis rect 8,8,504,120; dark = BT.601 integer luma < 128; bbox half-open.
          PASS = dark_pixel_count > 50, dark bbox >= 40x8 inside the rect, dark pixels not
          dominating the rect, unique_color_count >= 2. Antialiasing normally yields many
          distinct values; unique_color_count == 1 with ink present means no AA blending.
          d3d11_d2d uses a D3D11 RENDER_TARGET texture, a D2D DXGI-surface render target with
          alpha_ignore/DPI 96, DirectWrite DrawTextLayout, a STAGING copy and Map(READ).
          Map(READ) is the GPU completion point; there is no separate fence query.
          gdi uses CreateDIBSection (32bpp top-down), FillRect white, TextOutW black, GdiFlush.
          --driver warp is a control run; it proves the code path, NOT GPU/driver support.
          --debug-layer fails if the D3D11 SDK debug layer is not installed.
          Font fallback is NOT traced; a PASS does not prove the requested face was used.
          A PASS means "ink exists in this offscreen readback". It does not prove on-screen
          presentation, DWM composition, scanout, or that a visible window would show text.
          Logs contain adapter name/ids, session id, WOW64 state, d3d11.dll version only.

          v2 diagnostic modes (additive; --mode full is byte-identical to no --mode):
          d2d-primitives draws, into ONE target and one readback: a solid black
            FillRectangle at 8,8 64x64, a 1px black DrawRectangle at 80.5,8.5 63x63, and
            DrawTextLayout at 160,8. Items rect_fill / rect_stroke / text are judged
            separately, so "every D2D draw is lost" can be told apart from "only glyphs".
            Regions 4,4,76,76 / 76,4,148,76 / 152,4,508,124 are disjoint.
          dwrite-offscreen draws the same glyphs once per text antialias mode
            (cleartype, grayscale, aliased), each on its OWN texture and readback, and
            reports requested_aa/effective_aa (GetTextAntialiasMode) per item. Nothing is
            overwritten before it is measured, so no case can be hidden by a later draw.
          bitmap-brush fills 8,8 64x64 with a 1x1 pure-red (BGRA 0,0,255,255) bitmap brush
            (clamp/nearest) and DrawBitmap's a 1x1 pure-green bitmap into 200,8 64x64, then
            reports sampled_bgra, matched pixel count and region area. This separates
            texture sampling from geometry and from glyph rasterization.
          Mode items are judged by presence of the expected ink or colour, NOT by the
          full-mode text rule: a solid fill is expected to be 100% dark and single-coloured,
          so "dark must not dominate" and "unique_color_count >= 2" cannot apply. Item PASS =
          dark > 50 with bbox >= 8x4 for ink items, and >= 90% of the region matching the
          expected colour within +-2 per channel for colour items.
          A FAIL on geometry items but PASS on GDI points at the D2D/D3D path, not at fonts.
          A FAIL only on the text item points at glyph rasterization or glyph texture
          sampling; compare dwrite-offscreen and bitmap-brush to narrow it further.

          v3 diagnostic modes (also additive; v1/v2 lines are unchanged):
          a8-contract pins down the A8_UNORM value contract, because text masks are normally
            sampled from A8 and a wrong channel or a lost fractional value looks exactly like
            "no glyphs". It first prints CheckFormatSupport for A8_UNORM (texture2d /
            render_target / blendable / shader_sample / typed_uav), then five independent
            cases, each on its OWN 256x256 A8_UNORM texture cleared by itself and read back
            through its own staging copy:
              clear_zero            Clear(0,0,0,0)                 expected 0
              ps_half_no_blend      PS float4(1,1,1,0.5), blend off expected 128 or 255
              ps_half_src_alpha_blend  same PS, SRC_ALPHA/INV_SRC_ALPHA, cleared 0
                                                                expected 64, 128 or 255
              clear_one             Clear(0,0,0,1)                 expected 255
              uav_store_then_srv    typed UAV store float4(0.5,0.5,0.5,0.5) at 128,128, then
                                    an SRV sample into a second A8 target  expected 128
            Several expected values are listed where A8_UNORM makes more than one outcome
            legal: the format has one channel and does not fix which shader component feeds
            it, so float4(1,1,1,0.5) may be stored from .x (255) or from .w (128), and the
            blend may land on 64 (.w source through the RGB equations), 128 or 255. The
            UAV case stores 0.5 in all four channels precisely so its expected value stays
            unambiguous, and the .x-vs-.w question is answered once, by ps_half_no_blend.
            Five points (128,128 / 16,16 / 240,240 / 64,192 / 192,64) must each be within
            +-2 of one of the listed values, so a single lucky pixel cannot pass a case.
            A8CASE lines carry hr_ps / hr_draw / value / expected / RESULT; A8DETAIL lines
            carry the five points, tolerance, hr_map and case detail. hr_draw is
            ID3D11Device::GetDeviceRemovedReason() taken after the draw plus Flush, because
            ID3D11DeviceContext::Draw returns void and a removed device or a hang is
            observable only there. hr_ps is the shader compile/create code (S_OK where the
            case uses no shader).
            Reading: clear_zero FAIL means the readback channel is not what this probe
            assumes. ps_half_no_blend value 128 or 255 both mean the fractional value was
            quantized, not truncated, and which one also tells you which shader component
            A8 stores. ps_half_src_alpha_blend FAIL at value 0 means the blend dropped the
            source entirely, which is the path a DirectWrite mask blend would take; 64 vs
            128 vs 255 tells you which blend equations and which component applied.
            uav_store_then_srv separates the A8 store side from the A8 sample side.
          drawline draws four 232px-long lines, each on its own target and readback, all
            inside region 0,84,512,118:
              line_2px_integer_aa    y=100.0 width 2 antialiased  fully covered control
              line_1px_integer_aa    y=100.0 width 1 antialiased  fully covered control
              line_1px_half_aa       y=100.5 width 1 antialiased  partial coverage only
              line_1px_half_aliased  y=100.5 width 1 aliased      same geometry, AA off
            The two integer lines are the control: they are fully covered, so they must be
            dark exactly like the v2 solid fill. The half-pixel pair is the measurement: a
            line straddling two rows can only paint through the coverage path, and its
            aliased twin shows what the same geometry does with AA switched off.
            The AA half-pixel item is judged on NON-WHITE pixels, not on dark pixels: a
            50%-covered black-on-white pixel is mid-grey (luma about 127) and the luma < 128
            rule would classify it unpredictably. Any coverage at all, partial or full,
            passes it; its point is that ink exists. The other three items need dark > 50 with
            a dark bbox at least 100 px wide.
            A COVERAGE line then reports nonwhite counts for all four items and
            aa_path=paints_ink only if the antialiased half-pixel line produced non-white
            pixels. aa_path=paints_nothing with dark integer lines is the signature of a
            broken coverage rasterizer: geometry that needs no partial coverage works,
            geometry that does produces nothing.
          v4 diagnostic modes (also additive; v1/v2/v3 output formats are unchanged):
          a8-upload answers "was the UpdateSubresource upload into a single-channel format
            lost" separately from "can the value be written at all". For R8_UNORM and
            A8_UNORM it builds a 4x4 texture with BIND_SHADER_RESOURCE, uploads the bytes
            {0,64,128,255} into row 0 with UpdateSubresource (rowPitch 4, depthPitch 16),
            copies it to a staging texture and prints every texel as expected vs actual.
            It then draws a 4x4 BGRA8 target twice from the SAME texture: once through the
            default (identity) SRV, where the PS replicates .x for R8 (or .a for A8, since an
            identity R8 view yields (r,0,0,1)) into all three colour channels with alpha 255,
            and once through a second PS that returns the sampled float4 with x/y/z forced to
            zero and the stored channel moved to alpha, which produces the same (0,0,0,v)
            result that a (ZERO,ZERO,ZERO,R) component mapping would. D3D11 SRV descs have no
            Shader4ComponentMapping field, so the mapping is done in the PS. Expected:
            identity (v,v,v,255), mapped (0,0,0,v). A format the UMD refuses is reported as
            ITEM RESULT=SKIP with the failing hr, never as a crash. hr_tex/hr_srv/hr_update/hr_draw
            (device removed reason) are printed, and stage=format_support lists
            texture2d/shader_sample/shader_load. Reading: upload_raw PASS with identity PASS
            means the upload and the sample path are intact, so a lost glyph mask lies elsewhere.
          rt-to-srv renders 0.5 into an 8x8 R8_UNORM texture bound as RENDER_TARGET and
            SHADER_RESOURCE from one PS (expected 128 +-2), then draws a second pass that
            samples that same texture as an SRV into a BGRA8 target (expected 128,128,128
            +-2). It separates "R8 render target write works" from "the result survives
            being read as a texture in the same frame".
          d2d-aa-modes repeats the v2 shapes with the antialias mode varied, one target and
            one readback per item: rect_stroke_aa (the v2 1px stroke at 80.5,8.5), 
            rect_stroke_aliased (same geometry, ALIASED), triangle_fill_aa (FillGeometry of
            (40,20)-(120,20)-(80,100)), ellipse_fill_aa (FillEllipse centre 80,64 r40),
            line_d2d_aa (1px line on row 100.5, coverage-judged) and line_d2d_aliased (same
            line, aliased). Each item prints requested_aa and effective_aa
            (GetAntialiasMode), EndDraw hr, dark/nonwhite/unique counts and RESULT. The
            stroke pair is the key comparison: identical geometry with AA on and off.
          text-paths draws the same layout six ways, each on its own target and readback:
            solid_brush (DrawTextLayout + solid black), bitmap_brush (same layout + a 1x1
            black bitmap brush, clamp/nearest), text_aliased (geometry AND text antialias
            set to ALIASED), glyph_run (no layout: glyph indices and advances from the font
            face, DrawGlyphRun at the font baseline inside the region) and two GRAYSCALE
            draws into a D2D1_ALPHA_MODE_IGNORE and a D2D1_ALPHA_MODE_PREMULTIPLIED target.
            Each prints the region, alpha mode, brush, EndDraw hr, effective antialias mode,
            dark/nonwhite/unique counts and RESULT. A glyphs=N advance_sum= line and
            baseline_y= are printed for the direct run; a FAIL there with PASS on
            solid_brush points at the glyph-run path, not at the text layout.
          v5 diagnostic modes (also additive; every earlier mode is unchanged):
            Why these three: a D2D antialiased stroke is not MSAA. D2D rasterizes coverage
            into a uint mask texture, a second pass turns the per-pixel coverage into alpha
            with countbits (16x16 cells, one bit per sample), and that pass ends with
            clip(cov - 1/32) so zero-coverage cells are dropped. Text uses the same machinery
            with an A8 glyph atlas plus a lookup. So the suspects are clip/discard
            translation, R32_UINT typed Load + countbits on a texture written the same frame,
            and the dual-source blend factors; the v4 A8 swizzle question is already answered
            by a8-upload.
          clip-contract draws a full-screen triangle into a 64x64 BGRA8 target cleared white
            with a PS that reads x from a cbuffer and calls clip(x - 0.5) before returning
            opaque black. x=0.75 must paint (dark > 50 with a dark bbox at least 8x4) and
            x=0.25 must leave the target empty (dark = 0). The same two values are repeated
            with the discard keyword (if (x - 0.5 < 0) discard) and with the clip shader
            forced to ps_4_0, six items in total: clip_keep, clip_discard, discard_keep,
            discard_discard, clip_ps40_keep, clip_ps40_discard. A keep item with no ink is
            "always discards"; a discard item with ink is "always keeps"; the SUMMARY prints
            keep_with_ink, discard_without_ink and verdict=clip_and_discard_respected,
            always_discards, always_keeps or mixed. EndDraw-free mode: hr_draw is the device
            removed reason of each case.
          mask-uint builds a 256x256 R32_UINT texture with RENDER_TARGET, SHADER_RESOURCE and
            UNORDERED_ACCESS. ps_write_uint writes 0x00010001 from a PS and reads it back raw
            (2 bits set); uav_store_uint writes the same value from a compute shader through a
            typed UAV (Dispatch 16x16x1) and reads it back raw. Both are compared exactly, so
            a lost or reformatted uint write is visible per texel. countbits_sample then
            draws a BGRA8 target with a PS that does
            Texture2D<uint>::Load(int3(pos.xy,0)) and writes countbits(v)/16.0 (=2/16=0.125,
            about 32 of 255) to all channels; countbits_array_index does the same through
            eight separately bound Texture2D<uint> SRVs chosen by a cbuffer value (idx=3).
            The literal "Texture2D<uint> g[8]; g[idx]" form does not compile in HLSL
            (X3512: sampler array index must be a literal expression), so the item tests the
            part a driver actually translates: several uint SRVs bound at once plus a
            non-constant choice between them. Expected plane value 32 +-2; a SKIP with
            reason=array_variant_unavailable means the cbuffer or the array shader could not
            be created, not that it rendered wrong. A compile failure is reported as
            reason=shader_compile_failed with the compiler message, never as a silent skip.
          dualsrc-blend clears a 64x64 BGRA8 target to white and draws one full-screen PS that
            writes SV_Target0 = (0,0,0,1) and SV_Target1 = (0,0,0,0.5). Only the blend factors
            change: src1_alpha_blend uses SRC1_ALPHA/INV_SRC1_ALPHA and must produce grey 128
            (0.5 black over white), src1_color_blend uses SRC1_COLOR/INV_SRC1_COLOR where the
            source1 rgb is black so the factor is 0 and white 255 must survive (a driver that
            aliases SRC1_COLOR to SRC1_ALPHA reports 128 here), and src_alpha_blend uses
            SRC_ALPHA/INV_SRC_ALPHA where source0 alpha is 1 so the result must be black 0.
            The third item documents that an opaque source cannot produce grey through
            SRC_ALPHA; it is a control for the factor mapping, not a second copy of the
            SRC1_ALPHA expectation. Each item prints expected_bgra, sampled_bgra, matched
            count, region area, dark/nonwhite/unique and RESULT; alpha is not compared (the
            mode reports B/G/R).
          Modes never alter the full-mode numbers; a mode failure only changes the exit code
          and SUMMARY_MODES.
          '@ | Set-Content text-glyph-package\usage.txt -Encoding utf8
          Get-ChildItem text-glyph-package -File -Recurse | Sort-Object FullName | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, ([IO.Path]::GetRelativePath((Resolve-Path text-glyph-package).Path, $_.FullName))
          } | Set-Content text-glyph-package\SHA256SUMS.txt -Encoding ascii
          Get-Content text-glyph-package\SHA256SUMS.txt
          # The GPU-less runner evidence above is recorded, never gated: without
          # this the pwsh wrapper would promote the last native evidence exit code
          # into the step result. Self-test failures still throw before this line.
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: text-glyph-probe-arm64
          path: text-glyph-package/
          if-no-files-found: error
          retention-days: 30
