name: build-d3d11-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'test_d3d11.cpp'
      - 'test_d3d11_shared_probe.cpp'
      - 'display_state_probe.cpp'
      - 'test_display_pattern.cpp'
      - 'test_vk_features.cpp'
      - 'test_vk_compute.cpp'
      - 'compute.comp'
      - 'compute_nop.comp'
      - 'third_party/**'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  spirv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools
      - name: Compile compute.comp to SPIR-V
        run: |
          set -euo pipefail
          glslangValidator --version
          glslangValidator -V --target-env vulkan1.0 compute.comp -o compute.spv
          glslangValidator -V --target-env vulkan1.0 compute_nop.comp -o compute_nop.spv
          xxd -i -n compute_spirv compute.spv > compute_spirv.h
          xxd -i -n compute_nop_spirv compute_nop.spv > compute_nop_spirv.h
          ls -l compute.spv compute_nop.spv compute_spirv.h compute_nop_spirv.h
          head -2 compute_spirv.h
          tail -1 compute_spirv.h
          tail -1 compute_nop_spirv.h
      - uses: actions/upload-artifact@v4
        with:
          name: compute-spirv
          path: |
            compute_spirv.h
            compute_nop_spirv.h
          if-no-files-found: error
  build:
    needs: spirv
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compute-spirv
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build D3D11 smoke test
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /std:c++17 test_d3d11.cpp /Fe:test_d3d11_arm64.exe d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\test_d3d11_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\test_d3d11_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - name: Build D3D11 cross-process shared-texture probe
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /std:c++17 test_d3d11_shared_probe.cpp /Fe:d3d11_shared_probe_arm64.exe d3d11.lib dxgi.lib
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\d3d11_shared_probe_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS-shared.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\d3d11_shared_probe_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - name: Build read-only display capture probe (GUI ARM64)
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /W4 /std:c++17 /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 display_state_probe.cpp /Fe:display_state_probe_arm64.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib ole32.lib oleaut32.lib windowscodecs.lib shell32.lib uiautomationcore.lib
          if errorlevel 1 exit /b 1
      - name: Self-test and package display capture probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\display_state_probe_arm64.exe).Path
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($machine -ne 0xaa64 -or $subsystem -ne 2) { throw 'Expected ARM64 Windows GUI PE' }
          $out = Join-Path $env:RUNNER_TEMP ('display-self-test-' + [guid]::NewGuid())
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--out', "`"$out`"") -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw 'Self-test process exceeded 15 seconds' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$out\capture.txt") { Get-Content "$out\capture.txt" }
            throw "Self-test exit=$($p.ExitCode)"
          }
          Get-Content "$out\capture.txt"
          if (-not (Select-String -Path "$out\capture.txt" -SimpleMatch 'SELF_TEST=PASS' -Quiet)) { throw 'Missing PASS' }
          # Existing output directory must be refused without changing its files.
          $before = (Get-FileHash "$out\capture.txt").Hash
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--out', "`"$out`"") -PassThru
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw 'Existing-directory test timed out' }
          if ($p.ExitCode -ne 2 -or (Get-FileHash "$out\capture.txt").Hash -ne $before) { throw 'Output overwrite protection failed' }
          $p = Start-Process -FilePath $exe -ArgumentList '--unknown' -PassThru
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw 'Argument test timed out' }
          if ($p.ExitCode -ne 2) { throw 'Bad arguments must exit 2' }
          New-Item -ItemType Directory display-capture-package | Out-Null
          Copy-Item $exe, display_state_probe.cpp display-capture-package
          Copy-Item .github\workflows\build.yml display-capture-package\build-workflow.yml
          Copy-Item $out display-capture-package\self-test -Recurse
          @"
          source_commit=$env:GITHUB_SHA
          source_branch=$env:GITHUB_REF_NAME
          run=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          build_utc=$([DateTime]::UtcNow.ToString('o'))
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          machine=0x$($machine.ToString('x4'))
          subsystem=$subsystem (Windows GUI)
          compiler=MSVC cl /EHsc /O2 /W4 /std:c++17
          self_test=PASS (arguments, output protection, PNG 3x2 dimensions/reference pixels, owned UIA-child hard timeout)
          hardware_capture=NOT_TESTED
          hardware_UIA=NOT_TESTED
          "@ | Set-Content display-capture-package\build-info.txt -Encoding utf8
          @'
          display_state_probe_arm64.exe --capture --out C:\path\NEW_CAPTURE_DIR
          display_state_probe_arm64.exe --capture --out C:\path\NEW_CAPTURE_DIR --uia
          display_state_probe_arm64.exe --self-test --out C:\path\NEW_SELF_TEST_DIR

          GUI subsystem: no console or visible probe windows. Use Start-Process -Wait -PassThru
          when waiting for completion. --out is required; its parent must exist and the output
          directory must NOT exist. Nothing is overwritten. Invalid arguments / setup failure
          exit 2; if the output directory cannot be created there is no log to write.
          Exit 0 means requested API/encoding/metadata operations succeeded, NOT display correctness.
          Exit 2 means failure/partial/unavailable/timeout; preserve capture.txt and uia.txt.
          screen.png is saved and dimensions checked before UIA starts; it survives UIA failure.
          Session 0 is rejected; the thread desktop must match the current input desktop.
          No desktop switching is performed. Permission failures are logged without fallback.
          capture.txt: session, verified PMv2 DPI, physical virtual-screen rect, DC caps,
          BitBlt timing, PNG encode/verify timing, exact Win32/HRESULT failures.
          UIA is opt-in. It only reads visible existing StartMenuExperienceHost/SystemSettings
          windows, never opens/activates menus/settings, requests no Value/Text patterns, redacts
          password/edit Names, and emits at most 32 Name/ControlType/Bounds records, 160 UTF-16
          units per Name. uia.txt may contain user-specific names; treat PNG/logs as private.
          UIA runs in an owned child job: 3000 ms deadline then termination and <=1000 ms wait.
          Missing targets/session/permissions and UIA timeouts are failures, not a guessed PASS.
          PMv2 setup/verification failure aborts, with no silent DPI fallback.
          GDI BitBlt is synchronous screen readback, cursor not explicitly composited. A saved
          PNG cannot rule out corruption in this readback path or prove hardware/DWM correctness.
          Self-test uses only synthetic pixels/WIC plus a deliberately hung owned child; it does
          not capture a screen or prove UIA/GPU/device support. Device acceptance is separate.
          '@ | Set-Content display-capture-package\usage.txt -Encoding utf8
          Get-ChildItem display-capture-package -File -Recurse | Sort-Object FullName | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, ([IO.Path]::GetRelativePath((Resolve-Path display-capture-package).Path, $_.FullName))
          } | Set-Content display-capture-package\SHA256SUMS.txt -Encoding ascii
          Get-Content display-capture-package\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: display-state-capture-arm64
          path: display-capture-package/
          if-no-files-found: error
          retention-days: 30
      - name: Build independent GDI and hardware DirectWrite patterns
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /W4 /std:c++17 /DUNICODE /D_UNICODE /D_WIN32_WINNT=0x0A00 test_display_pattern.cpp /Fe:display_pattern_arm64.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib d2d1.lib dwrite.lib dxgi.lib dwmapi.lib
          if errorlevel 1 exit /b 1
      - name: Self-test and package display patterns (no hardware draw)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path .\display_pattern_arm64.exe).Path
          $b = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b,$pe+4) -ne 0xaa64 -or [BitConverter]::ToUInt16($b,$pe+24+68) -ne 2) { throw 'Expected ARM64 GUI' }
          $out = Join-Path $env:RUNNER_TEMP ('pattern-self-test-' + [guid]::NewGuid())
          $p = Start-Process $exe -ArgumentList @('--self-test','--out',"`"$out`"") -PassThru
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw 'Pattern self-test timeout' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path "$out\pattern.txt") { Get-Content "$out\pattern.txt" }
            throw "Pattern self-test exit=$($p.ExitCode)"
          }
          Get-Content "$out\pattern.txt"
          if (-not (Select-String -Path "$out\pattern.txt" -Pattern 'SELF_TEST=PASS' -SimpleMatch -Quiet)) { throw 'Missing self-test PASS' }
          if (-not (Select-String -Path "$out\pattern.txt" -Pattern 'OBSERVATION_SELF_TEST=PASS' -SimpleMatch -Quiet)) { throw 'Missing observation gate self-test PASS' }
          $before = (Get-FileHash "$out\pattern.txt").Hash
          $p = Start-Process $exe -ArgumentList @('--self-test','--out',"`"$out`"") -PassThru
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw 'Overwrite test timeout' }
          if ($p.ExitCode -ne 2 -or (Get-FileHash "$out\pattern.txt").Hash -ne $before) { throw 'Output protection failed' }
          $p = Start-Process $exe -ArgumentList '--mode gdi --duration 31 --out unused-invalid-pattern' -PassThru
          if (-not $p.WaitForExit(5000)) { $p.Kill(); throw 'Invalid args test timeout' }
          if ($p.ExitCode -ne 2 -or (Test-Path unused-invalid-pattern)) { throw 'Invalid duration not refused before window/directory' }
          New-Item -ItemType Directory display-pattern-package | Out-Null
          Copy-Item $exe, test_display_pattern.cpp display-pattern-package
          Copy-Item .github\workflows\build.yml display-pattern-package\build-workflow.yml
          Copy-Item $out display-pattern-package\self-test -Recurse
          @"
          source_commit=$env:GITHUB_SHA
          source_branch=$env:GITHUB_REF_NAME
          run=https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          run_attempt=$env:GITHUB_RUN_ATTEMPT
          build_utc=$([DateTime]::UtcNow.ToString('o'))
          runner=$env:RUNNER_OS/$env:RUNNER_ARCH
          machine=0xaa64 subsystem=2 GUI
          self_test=PASS parameters+CPU_reference+region_bounds+output_protection
          hardware_GDI=NOT_TESTED
          hardware_D2D_DWrite=NOT_TESTED
          font_selection=NOT_TESTED (runtime log records selected base face, fallback not traced)
          "@ | Set-Content display-pattern-package\build-info.txt -Encoding utf8
          @'
          display_pattern_arm64.exe --mode gdi --out C:\path\NEW_GDI_DIR --duration 20
          display_pattern_arm64.exe --mode dwrite --out C:\path\NEW_DWRITE_DIR --duration 20
          display_pattern_arm64.exe --self-test --out C:\path\NEW_SELFTEST_DIR

          GUI ARM64, one independent mode/window per invocation. No console. --out is required,
          its parent must exist, and its directory MUST NOT exist. Nothing is overwritten.
          --duration 1..30 seconds (default20): SOFT message-timer duration, closes only owned window.
          Acceptance runner MUST impose a separate 30s HARD cutoff for default20: record the new
          process PID/creation time (or retain Start-Process -PassThru process handle), WaitForExit
          at most 30000ms, and on timeout terminate ONLY that recorded owned process and mark FAIL.
          Do not kill by executable name or close unrelated windows. Task Scheduler may additionally
          set ExecutionTimeLimit PT30S, but retain process identity and verify it actually stopped.
          For one bounded foreground observation, use the existing external 30s hard supervisor:
          display_pattern_arm64.exe --mode gdi --out C:\path\NEW_GDI_DIR --duration 20 --foreground --capture-exe C:\path\display_state_probe_arm64.exe
          The capture path must be absolute and preverified SHA256:
          85577ab4c5006f11b8a5fa4417bf8741d98047fc539806fd4693cdd4d6106c52
          No automatic tool discovery/replacement. Capture is invoked once with --capture --out
          NEW_GDI_DIR\capture, without --uia; capture source/parameters are unchanged.
          Start both 20s soft and external 30s hard budgets at process launch, not FIRST_PAINT.
          External supervision must cover the recorded owned capture child too if the parent hangs.
          --foreground requests SetForegroundWindow once on our own HWND. OS denial => exit2
          observation_unavailable; no AttachThreadInput, focus-policy bypass, clicks or TOPMOST.
          After FIRST_PAINT, READY=metadata_eligible requires identity/foreground/visible/not-iconic/
          uncloaked/unchanged geometry and no known upper intersecting rectangle. READY expires
          after 5s or the soft deadline, whichever is first; no activation/capture retries.
          Pre/post capture snapshots and 50ms checks fail closed; foreground events latch changes.
          Event delivery/sampling is bounded evidence, NOT proof of no change at every instant.
          Z-order scan <=64 windows, <=16 intersection records; incomplete/unknown => unavailable.
          Conservative rectangles can reject transparent/irregular overlays. No titles/content read.
          Logs contain HWND/PID, own creation FILETIME, UTC FILETIME/ticks, state and geometry only.
          OBSERVATION=CAPTURE_COMPLETED means capture exit0 and state gates, NOT visible pixels.
          Independently inspect markers/patches/text and host screenshot; API states are not pixels.
          GDI and dwrite are separate serial runs, never auto-chain modes after a failure.
          No user-window closing, display/driver changes, menu activation or in-process readback.
          Launch one mode, take evidence with the separate known-good capture tool, let it exit,
          then launch the other mode into another new directory. Default mode does not steal focus;
          --foreground explicitly opts into one normal self-window activation and requires --capture-exe.
          Borderless non-topmost WS_POPUP, fixed 960x560 PHYSICAL window/client pixels, PMv2
          verified, centered entirely within physical rcWork; no DPI-scaled caption/frame inflation.
          It occludes underlying content only inside its own rectangle, not the taskbar/work-area
          exterior; default mode raises ONLY its own HWND once via HWND_TOP + SWP_NOACTIVATE,
          without moving/resizing it or SetForegroundWindow. --foreground instead requests normal
          activation once as described above. Neither mode uses HWND_TOPMOST or user-window changes.
          This is not permanent topmost: other/topmost windows may still occlude it; external
          screenshots must confirm actual visibility, not infer drawing failure from an absent pattern.
          Timer/external owned-PID timeout closes it; no caption close button or visible title.
          Small work area => explicit failure, not silent scaling. pattern.txt records physical
          rcWork/window/client bounds and checks containment/equality, DPI/session/desktop,
          API/HRESULT/Win32 failures, font base-face/glyph selection, CPU RGB/BGRA reference and
          every patch/text/mark location and expected string independently of rendered labels.
          GDI: FillRect + TextOutW. DirectWrite is used ONLY for installed base-font selection;
          it does not draw in GDI mode. GetTextFaceW reports actual GDI-mapped base font.
          dwrite: D2D HARDWARE HwndRenderTarget, DirectWrite DrawText, target DPI96 makes 1 DIP
          equal 1 physical client pixel. No DEFAULT/SOFTWARE/WARP or retry on device loss.
          DXGI adapter inventory is informational: actual internal D2D adapter binding is NOT
          proven. Font fallback is NOT traced; glyph absence alone does not prove font root cause.
          Window title exists only as metadata; the borderless window does not render a title.
          Colors are CPU-defined UNORM8 RGB, opaque; compare patch interiors, not text antialiasing.
          Exit0 means requested APIs returned success, not visual/hardware correctness. Exit2 means
          failure; preserve pattern.txt. Timer is a normal Win32 message timer, not preemption of a
          hung driver/API. Use independent external supervision if the graphics stack can hang.
          Self-test uses no window, no drawing, no font/GPU selection and proves no hardware support.
          D3D11 texture sampling is not implemented here; existing shared-texture probe remains separate.
          '@ | Set-Content display-pattern-package\usage.txt -Encoding utf8
          Get-ChildItem display-pattern-package -File -Recurse | Sort-Object FullName | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, ([IO.Path]::GetRelativePath((Resolve-Path display-pattern-package).Path, $_.FullName))
          } | Set-Content display-pattern-package\SHA256SUMS.txt -Encoding ascii
          Get-Content display-pattern-package\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: display-pattern-arm64
          path: display-pattern-package/
          if-no-files-found: error
          retention-days: 30
      - name: Build Vulkan feature probe
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /std:c++17 /I third_party\vulkan\include test_vk_features.cpp /Fe:vk_features_arm64.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\vk_features_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS-vk.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\vk_features_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - name: Build Vulkan compute test
        shell: cmd
        run: |
          powershell -NoProfile -Command "'spirv header: ' + (Get-FileHash .\compute_spirv.h -Algorithm SHA256).Hash"
          cl /nologo /EHsc /O2 /std:c++17 /I third_party\vulkan\include test_vk_compute.cpp /Fe:vk_compute_arm64.exe
          if errorlevel 1 exit /b 1
          powershell -NoProfile -Command "$h=Get-FileHash .\vk_compute_arm64.exe -Algorithm SHA256; $h.Hash | Tee-Object SHA256SUMS-compute.txt; $b=[IO.File]::ReadAllBytes((Resolve-Path .\vk_compute_arm64.exe)); $e=[BitConverter]::ToInt32($b,0x3c); 'machine=0x{0:x4}' -f [BitConverter]::ToUInt16($b,$e+4)"
      - uses: actions/upload-artifact@v4
        with:
          name: test-d3d11-arm64
          path: |
            test_d3d11_arm64.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-d3d11-shared-probe-arm64
          path: |
            d3d11_shared_probe_arm64.exe
            SHA256SUMS-shared.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-vk-features-arm64
          path: |
            vk_features_arm64.exe
            SHA256SUMS-vk.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-vk-compute-arm64
          path: |
            vk_compute_arm64.exe
            SHA256SUMS-compute.txt
          if-no-files-found: error
